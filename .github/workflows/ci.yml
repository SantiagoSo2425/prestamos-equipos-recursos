name: CI

on:
  push:
    branches: [main, develop, "feature/**", "feat/**", "fix/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: prestamos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d prestamos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Credenciales efímeras del servicio de CI; no son secretos reales.
      TEST_DATABASE_URL: postgresql+psycopg://ci_user:ci_password@localhost:5432/prestamos_test
      JWT_SECRET: secreto-solo-para-ci
      SEED_PASSWORD: ci-demo-password
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Migración y semilla desde cero (humo)
        env:
          DATABASE_URL: postgresql+psycopg://ci_user:ci_password@localhost:5432/prestamos_test
        run: |
          python -m alembic upgrade head
          python -m app.seed
          python -m alembic downgrade base

      - name: Pruebas automatizadas
        run: python -m pytest -v --junitxml=pytest-report.xml

      - name: Publicar reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: backend/pytest-report.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tipos y build
        env:
          VITE_API_URL: http://localhost:8000/api
        run: npm run build
