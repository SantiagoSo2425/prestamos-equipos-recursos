name: CD (Azure)

# Despliega a Azure solo cuando el CI termina en verde sobre `main`, o a mano con "Run workflow".
# Requiere el environment `azure` en GitHub con las variables y secretos de docs/despliegue.md.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-azure
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # OIDC con Azure, sin secretos de larga duración

env:
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  backend:
    name: Backend → ACR → App Service (contenedor)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: azure
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - name: Login en Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Construir y subir la imagen a Azure Container Registry
        run: |
          IMAGE="${{ vars.ACR_NAME }}.azurecr.io/prestamos-backend"
          az acr login --name "${{ vars.ACR_NAME }}"
          docker build -t "$IMAGE:${{ env.SHA }}" -t "$IMAGE:latest" backend
          docker push "$IMAGE:${{ env.SHA }}"
          docker push "$IMAGE:latest"
      - name: Desplegar la imagen en App Service (migra la BD al arrancar)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          images: ${{ vars.ACR_NAME }}.azurecr.io/prestamos-backend:${{ env.SHA }}
      - name: Prueba de humo (/api/health)
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "${{ vars.API_URL }}/health"; then echo; exit 0; fi
            echo "esperando al backend ($i/20)…"; sleep 15
          done
          echo "El backend no respondió a /api/health" >&2
          exit 1

  frontend:
    name: Frontend → Static Web Apps
    needs: backend
    runs-on: ubuntu-latest
    environment: azure
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Compilar (VITE_API_URL se fija en tiempo de compilación)
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.API_URL }}
        run: |
          npm ci
          npm run build
      - name: Publicar en Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: frontend/dist
          skip_app_build: true
          skip_api_build: true
